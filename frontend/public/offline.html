<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7C3AED" />
    <title>Você está sem conexão — FibroSync</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8f9fd;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #201733;
      }

      .card {
        width: 100%;
        max-width: 26rem;
        text-align: center;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 2rem;
        padding: 2.5rem 2rem;
        box-shadow: 0 32px 90px rgba(127, 109, 182, 0.13);
      }

      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.25rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #7b4dff 0%, #5c87ff 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon svg {
        width: 30px;
        height: 30px;
        stroke: #fff;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }

      p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #6b6478;
        margin: 0 0 1.75rem;
      }

      button {
        appearance: none;
        border: none;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        font-size: 0.9rem;
        color: #fff;
        background: linear-gradient(135deg, #7b4dff 0%, #5c87ff 100%);
        padding: 0.75rem 1.75rem;
        border-radius: 999px;
        box-shadow: 0 18px 42px rgba(149, 130, 196, 0.25);
      }

      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Você está sem conexão.</h1>
      <p>
        Algumas funcionalidades do FibroSync precisam de internet para
        carregar seus dados.
      </p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
